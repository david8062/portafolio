<nav class="navbar">
  <div class="navbar__container">
    <div class="navbar__content">
      <!-- Brand -->
      <div class="navbar__brand">
        <div class="navbar__brand-avatar">JD</div>
        <span class="navbar__brand-name">Jeferson Dávila</span>
      </div>

      <!-- Desktop Navigation -->
      <div class="navbar__nav">
        <button
          *ngFor="let item of navigationItems"
          (click)="scrollToSection(item.url)"
          [class.navbar__nav-item]="true"
          [class.navbar__nav-item--active]="activeSection === item.url.substring(1)">
          {{ item.title }}
        </button>
      </div>

      <!-- Social Links -->
      <div class="navbar__social">
        <a
          *ngFor="let social of socialLinks"
          [href]="social.url"
          target="_blank"
          rel="noopener noreferrer"
          class="navbar__social-item">
          <lucide-icon [name]="social.icon"></lucide-icon>
          <div class="navbar__social-tooltip">{{ social.name }}</div>
        </a>
      </div>

      <!-- Mobile menu button -->
      <button class="navbar__mobile-btn" (click)="isOpen = !isOpen">
<lucide-icon [name]="isOpen ? 'X' : 'Menu'"></lucide-icon>

      </button>
    </div>

    <!-- Mobile Menu -->
    <div class="navbar__mobile-menu" *ngIf="isOpen">
      <div class="navbar__mobile-menu-nav">
        <button
          *ngFor="let item of navigationItems"
          (click)="scrollToSection(item.url)"
          [class.navbar__mobile-menu-nav-item]="true"
          [class.navbar__mobile-menu-nav-item--active]="activeSection === item.url.substring(1)">
          {{ item.title }}
        </button>
      </div>

      <div class="navbar__mobile-menu-social">
        <p class="navbar__mobile-menu-social-title">Conecta conmigo</p>
        <div class="navbar__mobile-menu-social-grid">
          <a
            *ngFor="let social of socialLinks"
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            class="navbar__mobile-menu-social-item">
            <lucide-icon [name]="social.icon"></lucide-icon>
            <span>{{ social.name }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
