<section id="skills" class="skills-section">
  <div class="container">
    <div class="header">
      <h2>Skills & Tecnologías</h2>
      <div class="divider"></div>
    </div>

    <div class="grid">
      <div class="card" *ngFor="let category of skillCategories">
        <div class="card__header">
          <h3>{{ category.title }}</h3>
        </div>
        <div class="card__content">
          <div class="skill" *ngFor="let skill of category.skills">
            <div class="skill__info">
              <span class="skill__icon">{{ skill.icon }}</span>
              <span class="skill__name">{{ skill.name }}</span>
              <span class="skill__level">{{ skill.level }}%</span>
            </div>
            <div class="skill__bar">
              <div class="skill__bar-inner" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
